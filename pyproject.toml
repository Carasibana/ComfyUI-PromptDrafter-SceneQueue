[project]
name = "comfyui-promptdrafter-scenequeue"
version = "1.0.1"
description = "A ComfyUI companion pack for ComfyUI-PromptDrafter that adds scene-based batch generation — set up combinations of presets across multiple PromptDrafter nodes and render all of them in a single workflow run."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["comfyui", "stable-diffusion", "prompt", "batch", "scene", "queue", "ai", "image-generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Carasibana/ComfyUI-PromptDrafter-SceneQueue"
Repository = "https://github.com/Carasibana/ComfyUI-PromptDrafter-SceneQueue"
Issues = "https://github.com/Carasibana/ComfyUI-PromptDrafter-SceneQueue/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["*.py"]

[tool.comfy]
PublisherId = "carasibana"
DisplayName = "ComfyUI-PromptDrafter-SceneQueue"
