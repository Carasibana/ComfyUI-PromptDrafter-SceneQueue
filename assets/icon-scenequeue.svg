<svg viewBox="0 0 400 400" width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="iconClip">
      <rect width="400" height="400" rx="72"/>
    </clipPath>
  </defs>

  <!-- ── Base background — blueprint navy ── -->
  <rect width="400" height="400" rx="72" fill="#0b1220"/>

  <!-- ── Blueprint grid ── -->
  <g clip-path="url(#iconClip)">
    <g stroke="#1a3060" stroke-width="0.5" opacity="0.7">
      <line x1="0" y1="20"  x2="400" y2="20"/>  <line x1="0" y1="40"  x2="400" y2="40"/>
      <line x1="0" y1="60"  x2="400" y2="60"/>  <line x1="0" y1="80"  x2="400" y2="80"/>
      <line x1="0" y1="100" x2="400" y2="100"/> <line x1="0" y1="120" x2="400" y2="120"/>
      <line x1="0" y1="140" x2="400" y2="140"/> <line x1="0" y1="160" x2="400" y2="160"/>
      <line x1="0" y1="180" x2="400" y2="180"/> <line x1="0" y1="200" x2="400" y2="200"/>
      <line x1="0" y1="220" x2="400" y2="220"/> <line x1="0" y1="240" x2="400" y2="240"/>
      <line x1="0" y1="260" x2="400" y2="260"/> <line x1="0" y1="280" x2="400" y2="280"/>
      <line x1="0" y1="300" x2="400" y2="300"/> <line x1="0" y1="320" x2="400" y2="320"/>
      <line x1="0" y1="340" x2="400" y2="340"/> <line x1="0" y1="360" x2="400" y2="360"/>
      <line x1="0" y1="380" x2="400" y2="380"/>
      <line x1="20"  y1="0" x2="20"  y2="400"/> <line x1="40"  y1="0" x2="40"  y2="400"/>
      <line x1="60"  y1="0" x2="60"  y2="400"/> <line x1="80"  y1="0" x2="80"  y2="400"/>
      <line x1="100" y1="0" x2="100" y2="400"/> <line x1="120" y1="0" x2="120" y2="400"/>
      <line x1="140" y1="0" x2="140" y2="400"/> <line x1="160" y1="0" x2="160" y2="400"/>
      <line x1="180" y1="0" x2="180" y2="400"/> <line x1="200" y1="0" x2="200" y2="400"/>
      <line x1="220" y1="0" x2="220" y2="400"/> <line x1="240" y1="0" x2="240" y2="400"/>
      <line x1="260" y1="0" x2="260" y2="400"/> <line x1="280" y1="0" x2="280" y2="400"/>
      <line x1="300" y1="0" x2="300" y2="400"/> <line x1="320" y1="0" x2="320" y2="400"/>
      <line x1="340" y1="0" x2="340" y2="400"/> <line x1="360" y1="0" x2="360" y2="400"/>
      <line x1="380" y1="0" x2="380" y2="400"/>
    </g>
    <g stroke="#1e4080" stroke-width="1" opacity="0.8">
      <line x1="0" y1="100" x2="400" y2="100"/> <line x1="0" y1="200" x2="400" y2="200"/>
      <line x1="0" y1="300" x2="400" y2="300"/>
      <line x1="100" y1="0" x2="100" y2="400"/> <line x1="200" y1="0" x2="200" y2="400"/>
      <line x1="300" y1="0" x2="300" y2="400"/>
    </g>
    <g stroke="#2a5090" stroke-width="1" opacity="0.6">
      <line x1="96" y1="100" x2="104" y2="100"/>  <line x1="100" y1="96" x2="100" y2="104"/>
      <line x1="196" y1="100" x2="204" y2="100"/> <line x1="200" y1="96" x2="200" y2="104"/>
      <line x1="296" y1="100" x2="304" y2="100"/> <line x1="300" y1="96" x2="300" y2="104"/>
      <line x1="96" y1="200" x2="104" y2="200"/>  <line x1="100" y1="196" x2="100" y2="204"/>
      <line x1="196" y1="200" x2="204" y2="200"/> <line x1="200" y1="196" x2="200" y2="204"/>
      <line x1="296" y1="200" x2="304" y2="200"/> <line x1="300" y1="196" x2="300" y2="204"/>
      <line x1="96" y1="300" x2="104" y2="300"/>  <line x1="100" y1="296" x2="100" y2="304"/>
      <line x1="196" y1="300" x2="204" y2="300"/> <line x1="200" y1="296" x2="200" y2="304"/>
      <line x1="296" y1="300" x2="304" y2="300"/> <line x1="300" y1="296" x2="300" y2="304"/>
    </g>
  </g>

  <!-- ══════════════════════════════════════
       STACKED MINI PROMPTDRAFTER NODES
       Card dims: 214 × 202
       Stack offset: 14px right + 14px down each step back
       Card 1 (front): x=44,  y=72
       Card 2 (mid):   x=58,  y=58
       Card 3 (back):  x=72,  y=44
       ══════════════════════════════════════ -->

  <!-- ── Card 3 (back) ── -->
  <g opacity="0.32">
    <rect x="72" y="44" width="244" height="232" rx="14"
          fill="#162438" stroke="#4e6898" stroke-width="2.5"/>
    <!-- green field -->
    <rect x="86" y="60" width="216" height="52" rx="8" fill="#1a2e22" stroke="#3ecf8e" stroke-width="2"/>
    <text x="103" y="96" font-family="'SF Mono', 'Fira Code', monospace" font-size="30" fill="#3ecf8e" font-weight="300">+</text>
    <rect x="128" y="72" width="140" height="6" rx="3" fill="#3ecf8e" opacity="0.45"/>
    <rect x="128" y="84" width="104" height="6" rx="3" fill="#3ecf8e" opacity="0.26"/>
    <!-- red field -->
    <rect x="86" y="118" width="216" height="52" rx="8" fill="#2a1818" stroke="#e05252" stroke-width="2"/>
    <text x="103" y="153" font-family="'SF Mono', 'Fira Code', monospace" font-size="30" fill="#e05252" font-weight="300">−</text>
    <rect x="128" y="130" width="124" height="6" rx="3" fill="#e05252" opacity="0.45"/>
    <rect x="128" y="142" width="92"  height="6" rx="3" fill="#e05252" opacity="0.26"/>
    <!-- gray lora field -->
    <rect x="86" y="176" width="216" height="28" rx="8" fill="#1c1c28" stroke="#484860" stroke-width="1.5"/>
    <rect x="102" y="186" width="100" height="6" rx="3" fill="#707088" opacity="0.45"/>
  </g>

  <!-- ── Card 2 (middle) ── -->
  <g opacity="0.62">
    <rect x="58" y="58" width="244" height="232" rx="14"
          fill="#162438" stroke="#4e6898" stroke-width="2.5"/>
    <rect x="72" y="74" width="216" height="52" rx="8" fill="#1a2e22" stroke="#3ecf8e" stroke-width="2"/>
    <text x="89" y="110" font-family="'SF Mono', 'Fira Code', monospace" font-size="30" fill="#3ecf8e" font-weight="300">+</text>
    <rect x="114" y="86" width="140" height="6" rx="3" fill="#3ecf8e" opacity="0.45"/>
    <rect x="114" y="98" width="104" height="6" rx="3" fill="#3ecf8e" opacity="0.26"/>
    <rect x="72" y="132" width="216" height="52" rx="8" fill="#2a1818" stroke="#e05252" stroke-width="2"/>
    <text x="89" y="167" font-family="'SF Mono', 'Fira Code', monospace" font-size="30" fill="#e05252" font-weight="300">−</text>
    <rect x="114" y="144" width="124" height="6" rx="3" fill="#e05252" opacity="0.45"/>
    <rect x="114" y="156" width="92"  height="6" rx="3" fill="#e05252" opacity="0.26"/>
    <rect x="72" y="190" width="216" height="28" rx="8" fill="#1c1c28" stroke="#484860" stroke-width="1.5"/>
    <rect x="88" y="200" width="100" height="6" rx="3" fill="#707088" opacity="0.45"/>
  </g>

  <!-- ── Card 1 (front, full) ── -->
  <rect x="44" y="72" width="244" height="232" rx="14"
        fill="#162438" fill-opacity="0.95" stroke="#2e3e60" stroke-width="2"/>
  <!-- green field -->
  <rect x="58" y="88" width="216" height="52" rx="8" fill="#1a2e22" stroke="#3ecf8e" stroke-width="2.5"/>
  <text x="75" y="124" font-family="'SF Mono', 'Fira Code', monospace" font-size="30" fill="#3ecf8e" font-weight="300">+</text>
  <rect x="100" y="100" width="140" height="6" rx="3" fill="#3ecf8e" opacity="0.45"/>
  <rect x="100" y="112" width="104" height="6" rx="3" fill="#3ecf8e" opacity="0.26"/>
  <rect x="100" y="124" width="120" height="6" rx="3" fill="#3ecf8e" opacity="0.15"/>
  <!-- red field -->
  <rect x="58" y="146" width="216" height="52" rx="8" fill="#2a1818" stroke="#e05252" stroke-width="2.5"/>
  <text x="75" y="181" font-family="'SF Mono', 'Fira Code', monospace" font-size="30" fill="#e05252" font-weight="300">−</text>
  <rect x="100" y="158" width="124" height="6" rx="3" fill="#e05252" opacity="0.45"/>
  <rect x="100" y="170" width="92"  height="6" rx="3" fill="#e05252" opacity="0.26"/>
  <rect x="100" y="182" width="108" height="6" rx="3" fill="#e05252" opacity="0.15"/>
  <!-- gray lora field -->
  <rect x="58" y="204" width="216" height="28" rx="8" fill="#1c1c28" stroke="#484860" stroke-width="2"/>
  <rect x="74" y="214" width="100" height="6" rx="3" fill="#707088" opacity="0.45"/>
  <rect x="74" y="224" width="72"  height="6" rx="3" fill="#707088" opacity="0.28"/>

  <!-- ── Play button — horizontally centred on icon ── -->
  <circle cx="200" cy="296" r="46" fill="#162438" fill-opacity="0.96" stroke="#f0a030" stroke-width="3"/>
  <polygon points="184,276 230,296 184,316" fill="#f0a030"/>

  <!-- ══════════════════════════════════════
       FOUNTAIN PEN — identical to promptdrafter
       rotate(14, 311, 241)
       ══════════════════════════════════════ -->
  <g transform="rotate(14, 311, 241)">
    <rect x="300" y="104" width="22" height="92" rx="11" fill="#1a1a28"/>
    <rect x="319" y="111" width="4" height="78" rx="2" fill="#9098b8"/>
    <rect x="318" y="185" width="6" height="7" rx="3" fill="#a0a8c0"/>
    <rect x="300" y="193" width="22" height="9" fill="#9098b8"/>
    <rect x="300" y="202" width="22" height="118" fill="#1e1e30"/>
    <rect x="301" y="204" width="4" height="114" rx="2" fill="#ffffff" opacity="0.06"/>
    <rect x="300" y="318" width="22" height="8" fill="#9098b8"/>
    <rect x="302" y="326" width="18" height="20" rx="3" fill="#131318"/>
    <path d="M 302,346 L 311,378 L 320,346 C 317,339 305,339 302,346 Z" fill="#f0c040"/>
    <line x1="306" y1="349" x2="304" y2="370" stroke="#c89820" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <line x1="316" y1="349" x2="318" y2="370" stroke="#c89820" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <line x1="311" y1="378" x2="311" y2="346" stroke="#a07010" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
